<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-label="Convolution Kernel Filter Feature Map 관계">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#16838e"/></marker>
    <pattern id="gridBlue" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#98c9ce" stroke-width="1.4"/></pattern>
    <pattern id="gridOrange" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#e7a270" stroke-width="1.4"/></pattern>
  </defs>
  <rect width="1120" height="610" rx="26" fill="#f7f9fb"/>
  <text x="48" y="54" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17324d">Convolution 용어가 연결되는 과정</text>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="185" y="102" font-size="20" font-weight="700" fill="#17324d">RGB Input Image</text>
    <rect x="72" y="154" width="190" height="190" fill="#dce8ff" stroke="#5e8fe0" stroke-width="2"/>
    <rect x="92" y="134" width="190" height="190" fill="#e2f4e7" stroke="#61a978" stroke-width="2"/>
    <rect x="112" y="114" width="190" height="190" fill="#ffe5e5" stroke="#db6b6b" stroke-width="2"/>
    <rect x="148" y="150" width="78" height="78" fill="url(#gridBlue)" stroke="#17324d" stroke-width="3"/>
    <text x="125" y="330" font-size="17" fill="#db6b6b">R</text><text x="105" y="350" font-size="17" fill="#4d9664">G</text><text x="84" y="370" font-size="17" fill="#4e80cf">B</text>
    <text x="185" y="401" font-size="17" fill="#526a7d">같은 위치의 작은 영역</text>

    <text x="500" y="102" font-size="20" font-weight="700" fill="#17324d">Filter 1개</text>
    <g fill="#fff3e9" stroke="#d66b25" stroke-width="2">
      <rect x="405" y="125" width="90" height="90" fill="url(#gridOrange)"/>
      <rect x="455" y="170" width="90" height="90" fill="url(#gridOrange)"/>
      <rect x="505" y="215" width="90" height="90" fill="url(#gridOrange)"/>
    </g>
    <text x="450" y="234" font-size="16" fill="#9b4c1c">Kᵣ</text><text x="500" y="279" font-size="16" fill="#9b4c1c">Kɢ</text><text x="550" y="324" font-size="16" fill="#9b4c1c">Kʙ</text>
    <text x="500" y="365" font-size="17" fill="#526a7d">Channel별 Kernel의 묶음</text>

    <circle cx="700" cy="210" r="53" fill="#fff" stroke="#7e6dbc" stroke-width="3"/>
    <text x="700" y="202" font-size="18" font-weight="700" fill="#17324d">곱하고</text><text x="700" y="229" font-size="18" font-weight="700" fill="#17324d">모두 더함</text>
    <rect x="665" y="300" width="70" height="70" rx="12" fill="#fff0dc" stroke="#d66b25" stroke-width="3"/>
    <text x="700" y="343" font-size="24" font-weight="700" fill="#9b4c1c">z</text>
    <text x="700" y="401" font-size="17" fill="#526a7d">한 위치의 Output 값</text>

    <text x="930" y="102" font-size="20" font-weight="700" fill="#17324d">Feature Map 1개</text>
    <rect x="825" y="130" width="210" height="210" fill="#edf1ff" stroke="#7e6dbc" stroke-width="3"/>
    <g stroke="#b4addd" stroke-width="1.5"><path d="M867 130v210M909 130v210M951 130v210M993 130v210"/><path d="M825 172h210M825 214h210M825 256h210M825 298h210"/></g>
    <rect x="909" y="214" width="42" height="42" fill="#f6a65d" stroke="#9b4c1c" stroke-width="2"/>
    <text x="930" y="370" font-size="17" fill="#526a7d">위치별 z가 모인 Output</text>
  </g>

  <g stroke="#16838e" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M310 215h75"/><path d="M605 215h32"/><path d="M748 235h55"/>
  </g>
  <path d="M227 189C320 440 770 465 905 355" fill="none" stroke="#d66b25" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="557" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#9b4c1c">같은 Filter를 다음 위치로 이동하며 계산 반복</text>

  <g font-family="Arial,sans-serif">
    <rect x="82" y="515" width="956" height="60" rx="14" fill="#eaf7f8" stroke="#86c9ce"/>
    <text x="120" y="552" font-size="18" font-weight="700" fill="#17324d">Kernel</text><text x="200" y="552" font-size="17" fill="#526a7d">Channel별 Weight 행렬</text>
    <text x="450" y="552" font-size="18" font-weight="700" fill="#17324d">Filter</text><text x="512" y="552" font-size="17" fill="#526a7d">Kernel 묶음</text>
    <text x="710" y="552" font-size="18" font-weight="700" fill="#17324d">Feature Map</text><text x="832" y="552" font-size="17" fill="#526a7d">위치별 계산 결과</text>
  </g>
</svg>
