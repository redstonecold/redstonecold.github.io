<g font-family="Arial,sans-serif" text-anchor="middle"><text x="235" y="108" font-size="20" font-weight="700" fill="#17324d">Input 영역 X</text><text x="545" y="108" font-size="20" font-weight="700" fill="#17324d">Kernel K</text><text x="900" y="108" font-size="20" font-weight="700" fill="#17324d">Feature Map의 값</text>
