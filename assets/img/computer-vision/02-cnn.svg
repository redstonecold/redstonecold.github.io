<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-label="RGB Filter와 CNN Feature 추출">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#d56b28"/></marker></defs><rect width="1100" height="480" rx="28" fill="#f7f9fc"/>
<text x="48" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17324d">Filter 하나는 RGB 세 Channel을 동시에 봅니다</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="104" width="230" height="252" rx="18" fill="#eaf7f8" stroke="#86c9ce" stroke-width="3"/><text x="170" y="142" font-size="21" font-weight="700" fill="#17324d">RGB Input</text><rect x="92" y="174" width="130" height="92" fill="#ef6666" opacity=".65"/><rect x="112" y="194" width="130" height="92" fill="#61bc7a" opacity=".65"/><rect x="132" y="214" width="130" height="92" fill="#5e8fe0" opacity=".65"/><text x="170" y="333" font-size="17" fill="#527083">H × W × 3</text>
<rect x="365" y="104" width="260" height="252" rx="18" fill="#fff3e9" stroke="#efaf7d" stroke-width="3"/><text x="495" y="142" font-size="21" font-weight="700" fill="#17324d">Filter 1</text><text x="495" y="184" font-size="18" fill="#b9531a">Red Kernel 3 × 3</text><text x="495" y="222" font-size="18" fill="#398454">Green Kernel 3 × 3</text><text x="495" y="260" font-size="18" fill="#426db3">Blue Kernel 3 × 3</text><text x="495" y="310" font-size="17" fill="#527083">27개 곱을 합산 + Bias</text>
<rect x="705" y="104" width="330" height="252" rx="18" fill="#edf1ff" stroke="#9cabe7" stroke-width="3"/><text x="870" y="142" font-size="21" font-weight="700" fill="#17324d">32 Filters</text><text x="870" y="187" font-size="18" fill="#5266a6">Filter 1 → Feature Map 1</text><text x="870" y="224" font-size="18" fill="#5266a6">Filter 2 → Feature Map 2</text><text x="870" y="261" font-size="18" fill="#5266a6">⋮</text><text x="870" y="298" font-size="18" fill="#5266a6">Filter 32 → Feature Map 32</text><text x="870" y="333" font-size="17" fill="#527083">Output: Hout × Wout × 32</text></g>
<g stroke="#d56b28" stroke-width="4" marker-end="url(#a)"><path d="M285 230h68"/><path d="M625 230h68"/></g><text x="550" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">같은 Filter Weight가 모든 위치를 이동합니다 · Local Receptive Field + Weight Sharing</text>
</svg>
