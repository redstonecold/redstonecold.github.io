<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-label="Pixel Channel Image Shape와 Tensor 차원">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#16838e"/></marker></defs><rect width="1120" height="500" rx="28" fill="#f6f9fc"/><text x="48" y="56" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17324d">Pixel → Channel → Image → Batch</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="50" y="118" width="210" height="245" rx="18" fill="#fff3e9" stroke="#efaf7d" stroke-width="3"/><text x="155" y="158" font-size="21" font-weight="700" fill="#17324d">RGB Pixel</text><circle cx="115" cy="225" r="35" fill="#ef6666"/><circle cx="155" cy="225" r="35" fill="#61bc7a" fill-opacity=".8"/><circle cx="195" cy="225" r="35" fill="#5e8fe0" fill-opacity=".8"/><text x="155" y="302" font-size="19" fill="#526a7d">[R, G, B]</text><text x="155" y="334" font-size="17" fill="#526a7d">1D Tensor</text>
<rect x="335" y="118" width="210" height="245" rx="18" fill="#eaf7f8" stroke="#86c9ce" stroke-width="3"/><text x="440" y="158" font-size="21" font-weight="700" fill="#17324d">Color Image</text><rect x="375" y="190" width="130" height="100" fill="#fff" stroke="#16838e" stroke-width="3"/><path d="M375 225h130M375 258h130M418 190v100M462 190v100" stroke="#86c9ce"/><text x="440" y="326" font-size="19" fill="#526a7d">(H, W, 3)</text>
<rect x="620" y="118" width="210" height="245" rx="18" fill="#edf1ff" stroke="#a59ae0" stroke-width="3"/><text x="725" y="158" font-size="21" font-weight="700" fill="#17324d">One Image</text><text x="725" y="223" font-size="25" fill="#5d55a0">224 × 224 × 3</text><text x="725" y="273" font-size="18" fill="#526a7d">3D Tensor</text><text x="725" y="326" font-size="17" fill="#526a7d">N 없음</text>
<rect x="905" y="118" width="170" height="245" rx="18" fill="#eaf5ed" stroke="#80bf91" stroke-width="3"/><text x="990" y="158" font-size="21" font-weight="700" fill="#17324d">Batch</text><text x="990" y="216" font-size="21" fill="#398454">N Images</text><text x="990" y="262" font-size="18" fill="#526a7d">(N, H, W, C)</text><text x="990" y="310" font-size="17" fill="#526a7d">4D Tensor</text></g>
<g stroke="#16838e" stroke-width="4" marker-end="url(#a)"><path d="M260 240h63"/><path d="M545 240h63"/><path d="M830 240h63"/></g><text x="560" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Channel은 같은 공간 위치에 겹쳐 있는 정보 성분입니다</text>
</svg>
