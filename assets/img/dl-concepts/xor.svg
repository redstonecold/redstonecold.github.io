<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><title>XOR: 모델의 표현력에 생기는 한계</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="430" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">XOR: 모델의 표현력에 생기는 한계</text><path d="M140 100 V355 H490" stroke="#52677a" fill="none" stroke-width="2"/><circle cx="185" cy="315" r="20" fill="#dc7424"/><text x="185" y="360" font-size="19" fill="#15334c" text-anchor="middle">(0, 0) → 0</text><circle cx="185" cy="135" r="20" fill="#078b91"/><text x="185" y="180" font-size="19" fill="#15334c" text-anchor="middle">(0, 1) → 1</text><circle cx="430" cy="315" r="20" fill="#078b91"/><text x="430" y="360" font-size="19" fill="#15334c" text-anchor="middle">(1, 0) → 1</text><circle cx="430" cy="135" r="20" fill="#dc7424"/><text x="430" y="180" font-size="19" fill="#15334c" text-anchor="middle">(1, 1) → 0</text><text x="120" y="110" font-size="20" fill="#15334c" text-anchor="middle">x₂</text><text x="505" y="360" font-size="20" fill="#15334c" text-anchor="middle">x₁</text><rect x="560" y="135" width="340" height="90" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="730.0" y="170" font-size="22" fill="#078b91" text-anchor="middle">XOR</text><text x="730.0" y="200" font-size="16" fill="#15334c" text-anchor="middle">서로 다른 Input이면 1</text><text x="730" y="275" font-size="19" fill="#15334c" text-anchor="middle">같은 Class가 대각선에 있다.</text><text x="730" y="315" font-size="19" fill="#15334c" text-anchor="middle">직선 하나로는 분리할 수 없다.</text></g></svg>