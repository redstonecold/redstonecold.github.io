<svg xmlns="http://www.w3.org/2000/svg" width="960" height="485" viewBox="0 0 960 485" role="img"><title>Hidden Neuron 하나에 여러 경로가 연결된다</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="485" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">Hidden Neuron 하나에 여러 경로가 연결된다</text><rect x="25" y="175" width="205" height="90" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="127.5" y="210" font-size="22" fill="#078b91" text-anchor="middle">Hidden activation</text><text x="127.5" y="240" font-size="16" fill="#15334c" text-anchor="middle">aₖ⁽ᴸ⁻¹⁾</text><rect x="350" y="95" width="200" height="75" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="450.0" y="130" font-size="22" fill="#078b91" text-anchor="middle">Output 0</text><text x="450.0" y="160" font-size="16" fill="#15334c" text-anchor="middle">경로 A</text><rect x="350" y="285" width="200" height="75" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="450.0" y="320" font-size="22" fill="#dc7424" text-anchor="middle">Output 1</text><text x="450.0" y="350" font-size="16" fill="#15334c" text-anchor="middle">경로 B</text><rect x="735" y="180" width="190" height="80" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="830.0" y="215" font-size="22" fill="#dc7424" text-anchor="middle">Total Cost</text><text x="830.0" y="245" font-size="16" fill="#15334c" text-anchor="middle">C₀</text><path d="M240 205 L338 133" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M240 235 L338 320" fill="none" stroke="#dc7424" stroke-width="3" marker-end="url(#o)"/><path d="M560 133 L725 205" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M560 320 L725 240" fill="none" stroke="#dc7424" stroke-width="3" marker-end="url(#o)"/><text x="480" y="412" font-size="23" fill="#dc7424" text-anchor="middle">Backward: 경로 A의 기여 + 경로 B의 기여</text><text x="480" y="454" font-size="21" fill="#15334c" text-anchor="middle">경로 안에서는 곱하고, 갈라진 경로들은 더한다.</text></g></svg>