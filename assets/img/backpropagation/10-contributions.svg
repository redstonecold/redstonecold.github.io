<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>여러 Output의 요구는 부호와 크기를 포함해 합한다</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="340" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">여러 Output의 요구는 부호와 크기를 포함해 합한다</text><rect x="35" y="110" width="260" height="95" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="165.0" y="145" font-size="22" fill="#078b91" text-anchor="middle">Output 0의 기여</text><text x="165.0" y="175" font-size="16" fill="#15334c" text-anchor="middle">+0.6</text><text x="330" y="170" font-size="32" fill="#15334c" text-anchor="middle">+</text><rect x="365" y="110" width="260" height="95" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="495.0" y="145" font-size="22" fill="#dc7424" text-anchor="middle">Output 1의 기여</text><text x="495.0" y="175" font-size="16" fill="#15334c" text-anchor="middle">−0.2</text><text x="660" y="170" font-size="32" fill="#15334c" text-anchor="middle">=</text><rect x="700" y="110" width="225" height="95" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="812.5" y="145" font-size="22" fill="#078b91" text-anchor="middle">합계</text><text x="812.5" y="175" font-size="16" fill="#15334c" text-anchor="middle">+0.4</text><text x="480" y="260" font-size="21" fill="#15334c" text-anchor="middle">두 경로가 반대 방향이면 일부 상쇄된다.</text><text x="480" y="304" font-size="17" fill="#52677a" text-anchor="middle">숫자는 방향과 합산을 보여 주는 예시이며, 최종 Weight가 아니다.</text></g></svg>