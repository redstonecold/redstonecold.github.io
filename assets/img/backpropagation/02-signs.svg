<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img"><title>연결의 부호를 따라가기</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="390" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">연결의 부호를 따라가기</text><text x="480" y="86" font-size="20" fill="#15334c" text-anchor="middle">목표: 숫자 2의 Output을 높이기</text><rect x="40" y="110" width="240" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="160.0" y="145" font-size="22" fill="#078b91" text-anchor="middle">이전 Activation ↑</text><text x="160.0" y="175" font-size="16" fill="#15334c" text-anchor="middle">앞쪽 Layer의 계산 결과</text><path d="M290 152 L650 152" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><text x="470" y="137" font-size="21" fill="#15334c" text-anchor="middle">Positive Weight</text><rect x="675" y="110" width="235" height="85" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="792.5" y="145" font-size="22" fill="#dc7424" text-anchor="middle">Output ↑</text><text x="792.5" y="175" font-size="16" fill="#15334c" text-anchor="middle">Sigmoid Neuron</text><rect x="40" y="230" width="240" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="160.0" y="265" font-size="22" fill="#078b91" text-anchor="middle">이전 Activation ↓</text><text x="160.0" y="295" font-size="16" fill="#15334c" text-anchor="middle">앞쪽 Layer의 계산 결과</text><path d="M290 272 L650 272" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><text x="470" y="257" font-size="21" fill="#15334c" text-anchor="middle">Negative Weight</text><rect x="675" y="230" width="235" height="85" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="792.5" y="265" font-size="22" fill="#dc7424" text-anchor="middle">Output ↑</text><text x="792.5" y="295" font-size="16" fill="#15334c" text-anchor="middle">Sigmoid Neuron</text><text x="480" y="362" font-size="18" fill="#15334c" text-anchor="middle">연결의 부호가 다르면, 앞쪽 Activation에 필요한 변화도 달라진다.</text></g></svg>