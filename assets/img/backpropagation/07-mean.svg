<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435" role="img"><title>Example마다 다른 기여를 평균 내기</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="435" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">Example마다 다른 기여를 평균 내기</text><text x="210" y="90" font-size="19" fill="#15334c" text-anchor="middle">같은 현재 Weight에서 계산</text><text x="690" y="90" font-size="19" fill="#15334c" text-anchor="middle">예시: 한 Weight의 Gradient</text><rect x="35" y="115" width="195" height="65" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="132.5" y="150" font-size="22" fill="#078b91" text-anchor="middle">Example A</text><path d="M240 147 L285 147" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><rect x="300" y="115" width="140" height="65" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="370.0" y="150" font-size="22" fill="#078b91" text-anchor="middle">+0.6</text><path d="M450 147 L610 240" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><rect x="35" y="205" width="195" height="65" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="132.5" y="240" font-size="22" fill="#078b91" text-anchor="middle">Example B</text><path d="M240 237 L285 237" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><rect x="300" y="205" width="140" height="65" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="370.0" y="240" font-size="22" fill="#078b91" text-anchor="middle">−0.2</text><path d="M450 237 L610 240" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><rect x="35" y="295" width="195" height="65" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="132.5" y="330" font-size="22" fill="#078b91" text-anchor="middle">Example C</text><path d="M240 327 L285 327" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><rect x="300" y="295" width="140" height="65" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="370.0" y="330" font-size="22" fill="#078b91" text-anchor="middle">−0.1</text><path d="M450 327 L610 240" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><rect x="630" y="190" width="285" height="95" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="772.5" y="225" font-size="22" fill="#dc7424" text-anchor="middle">Mean = +0.1</text><text x="772.5" y="255" font-size="16" fill="#15334c" text-anchor="middle">Gradient Descent: Weight ↓</text><text x="480" y="405" font-size="18" fill="#15334c" text-anchor="middle">최종 Weight의 평균이 아니라, 같은 지점에서 구한 Gradient의 평균이다.</text></g></svg>