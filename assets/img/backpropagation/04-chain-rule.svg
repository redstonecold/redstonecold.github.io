<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>Chain Rule: 긴 경로를 세 구간으로 나누기</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="340" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">Chain Rule: 긴 경로를 세 구간으로 나누기</text><rect x="30" y="110" width="165" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="112.5" y="145" font-size="22" fill="#078b91" text-anchor="middle">Weight w</text><text x="112.5" y="175" font-size="16" fill="#15334c" text-anchor="middle">조금 바꾼다</text><rect x="275" y="110" width="165" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="357.5" y="145" font-size="22" fill="#078b91" text-anchor="middle">z</text><text x="357.5" y="175" font-size="16" fill="#15334c" text-anchor="middle">가중합이 변한다</text><rect x="520" y="110" width="165" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="602.5" y="145" font-size="22" fill="#078b91" text-anchor="middle">Activation a</text><text x="602.5" y="175" font-size="16" fill="#15334c" text-anchor="middle">Output이 변한다</text><rect x="765" y="110" width="165" height="85" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="847.5" y="145" font-size="22" fill="#dc7424" text-anchor="middle">Cost C₀</text><text x="847.5" y="175" font-size="16" fill="#15334c" text-anchor="middle">오차가 변한다</text><path d="M202 153 L264 153" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M447 153 L509 153" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M692 153 L754 153" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><text x="233" y="95" font-size="26" fill="#15334c" text-anchor="middle">①</text><text x="478" y="95" font-size="26" fill="#15334c" text-anchor="middle">②</text><text x="723" y="95" font-size="26" fill="#15334c" text-anchor="middle">③</text><text x="480" y="250" font-size="20" fill="#15334c" text-anchor="middle">① w → z의 변화율   ×   ② z → a의 변화율   ×   ③ a → C₀의 변화율</text><text x="480" y="300" font-size="22" fill="#dc7424" text-anchor="middle">한 경로를 따라가는 변화율은 곱한다.</text></g></svg>