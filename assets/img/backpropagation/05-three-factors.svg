<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>Gradient를 만드는 세 요소</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="340" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">Gradient를 만드는 세 요소</text><rect x="30" y="105" width="270" height="90" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="165.0" y="140" font-size="22" fill="#078b91" text-anchor="middle">이전 Activation</text><text x="165.0" y="170" font-size="16" fill="#15334c" text-anchor="middle">Input이 얼마나 큰가?</text><text x="165" y="235" font-size="17" fill="#15334c" text-anchor="middle">같은 Weight 변화의 영향</text><rect x="345" y="105" width="270" height="90" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="480.0" y="140" font-size="22" fill="#078b91" text-anchor="middle">Sigmoid slope</text><text x="480.0" y="170" font-size="16" fill="#15334c" text-anchor="middle">지금 얼마나 가파른가?</text><text x="480" y="235" font-size="17" fill="#15334c" text-anchor="middle">평평한 구간에서는 작아짐</text><rect x="660" y="105" width="270" height="90" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="795.0" y="140" font-size="22" fill="#078b91" text-anchor="middle">Prediction error</text><text x="795.0" y="170" font-size="16" fill="#15334c" text-anchor="middle">목표와 얼마나 다른가?</text><text x="795" y="235" font-size="17" fill="#15334c" text-anchor="middle">변화 방향과 오차의 크기</text><text x="323" y="157" font-size="30" fill="#dc7424" text-anchor="middle">×</text><text x="638" y="157" font-size="30" fill="#dc7424" text-anchor="middle">×</text><text x="480" y="299" font-size="22" fill="#dc7424" text-anchor="middle">세 요소가 함께 Weight Gradient를 결정한다.</text></g></svg>