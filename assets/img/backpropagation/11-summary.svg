<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>학습의 전체 흐름</title><defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#078b91"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#dc7424"/></marker></defs><rect width="960" height="340" rx="20" fill="#f5f8fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="47" font-size="25" fill="#15334c" text-anchor="start">학습의 전체 흐름</text><rect x="35" y="120" width="260" height="110" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="165.0" y="155" font-size="22" fill="#078b91" text-anchor="middle">Forward</text><text x="165.0" y="185" font-size="16" fill="#15334c" text-anchor="middle">값을 계산한다</text><rect x="350" y="120" width="260" height="110" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="480.0" y="155" font-size="22" fill="#078b91" text-anchor="middle">Backpropagation</text><text x="480.0" y="185" font-size="16" fill="#15334c" text-anchor="middle">Gradient를 계산한다</text><rect x="665" y="120" width="260" height="110" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="795.0" y="155" font-size="22" fill="#078b91" text-anchor="middle">Gradient Descent</text><text x="795.0" y="185" font-size="16" fill="#15334c" text-anchor="middle">Parameter를 바꾼다</text><path d="M303 175 L340 175" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M618 175 L655 175" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><text x="480" y="295" font-size="21" fill="#dc7424" text-anchor="middle">값 → 변화율 → 업데이트: 세 역할을 구분해서 읽는다.</text></g></svg>