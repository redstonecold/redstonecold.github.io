th="165" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="112.5" y="275" font-size="22" fill="#078b91" text-anchor="middle">Forward</text><text x="112.5" y="305" font-size="16" fill="#15334c" text-anchor="middle">현재 Parameter 사용</text><rect x="275" y="240" width="165" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="357.5" y="275" font-size="22" fill="#078b91" text-anchor="middle">Backward</text><text x="357.5" y="305" font-size="16" fill="#15334c" text-anchor="middle">Gradient 계산</text><rect x="520" y="240" width="165" height="85" rx="14" fill="white" stroke="#078b91" stroke-width="2"/><text x="602.5" y="275" font-size="22" fill="#078b91" text-anchor="middle">Mean</text><text x="602.5" y="305" font-size="16" fill="#15334c" text-anchor="middle">묶음 안에서 평균</text><rect x="765" y="240" width="165" height="85" rx="14" fill="white" stroke="#dc7424" stroke-width="2"/><text x="847.5" y="275" font-size="22" fill="#dc7424" text-anchor="middle">Update</text><text x="847.5" y="305" font-size="16" fill="#15334c" text-anchor="middle">한 번 업데이트</text><path d="M202 282 L264 282" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M447 282 L509 282" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><path d="M692 282 L754 282" fill="none" stroke="#078b91" stroke-width="3" marker-end="url(#t)"/><text x="480" y="382" font-size="20" fill="#dc7424" text-anchor="middle">다음 Mini-batch에서는 업데이트된 Parameter로 다시 계산한다.</text></g></svg>